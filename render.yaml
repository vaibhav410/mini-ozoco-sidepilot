# Render Blueprint -- deploys the Mini OZOCO SidePilot AI System.
# Free tier: 512 MB RAM, sleeps after 15 min idle (first request wakes it),
# and has NO persistent disk -- the local filesystem (uploads, exports,
# the FAISS index under INDEX_DIR) is wiped on every redeploy and on
# most sleep/wake cycles. Chat history/intents/actions survive that
# because they live in DATABASE_URL (set it to a hosted Postgres, e.g.
# Neon's free tier, for real persistence in production); document
# uploads are best-effort on this plan -- for durable documents too,
# attach a Render Disk mounted at INDEX_DIR/UPLOAD_DIR (paid).
services:
  - type: web
    name: ozoco-sidepilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: EMBEDDINGS_BACKEND
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_VISION_FALLBACK_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SPEECH_MODEL
        value: whisper-large-v3-turbo
      - key: RATE_LIMIT_REQUESTS
        value: "40"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: GOOGLE_API_KEY
        sync: false # secret -- set in the Render dashboard
      - key: GROQ_API_KEY
        sync: false # secret -- set in the Render dashboard
      - key: DATABASE_URL
        sync: false # optional -- hosted Postgres URL for real persistence
      - key: ADMIN_TOKEN
        sync: false # optional -- non-browser fallback for /admin* (curl/API)
      - key: CLERK_PUBLISHABLE_KEY
        sync: false # secret -- Clerk Dashboard -> API Keys (safe to embed, but set here so it's templated into the pages)
      - key: CLERK_SECRET_KEY
        sync: false # secret -- Clerk Dashboard -> API Keys; verifies sessions server-side
      - key: ADMIN_EMAIL
        sync: false # secret -- the one account that reaches /admin after signing in
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false # secret -- set to this service's https://*.onrender.com URL (or custom domain) once known
