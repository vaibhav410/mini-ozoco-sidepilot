<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OZOCO SidePilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M22 14h14l8 8v22a3 3 0 0 1-3 3H22a3 3 0 0 1-3-3V17a3 3 0 0 1 3-3z' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M36 14v8h8' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round'/%3E%3Ccircle cx='30' cy='33' r='5' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='m34 37 5 5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-2: #141414;
    --surface-3: #1f1f1f;
    --border: rgba(255, 255, 255, 0.09);
    --border-2: rgba(255, 255, 255, 0.16);
    --text: #ededed;
    --text-2: #a1a1a1;
    --text-3: #666666;
    --white: #ffffff;
    --green: #45d483;
    --green-dim: rgba(69, 212, 131, 0.10);
    --amber: #f5a623;
    --amber-dim: rgba(245, 166, 35, 0.10);
    --red: #ff5b56;
    --blue: #52a9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Geist", "Inter", -apple-system, sans-serif;
    letter-spacing: -0.01em;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    overflow: hidden;
    overflow-x: hidden;
    height: 100dvh; /* mobile browsers: track the real visible viewport */
  }
  @supports not (height: 100dvh) { body { height: 100vh; } }
  ::selection { background: rgba(255,255,255,.22); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  svg { flex-shrink: 0; }
  button { font-family: inherit; }

  /* ================= Navbar ================= */
  .nav {
    display: flex; align-items: center; gap: 22px;
    padding: 0 22px; height: 56px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,.75); backdrop-filter: blur(14px);
    z-index: 20;
  }
  .logo { display: flex; align-items: center; gap: 9px; }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 7px;
    border: 1.5px solid var(--white); display: grid; place-items: center;
    color: var(--white);
  }
  .logo-mark svg { width: 13px; height: 13px; }
  .logo-name { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; color: var(--white); }
  .nav-links { display: flex; align-items: center; gap: 4px; margin: 0 auto; }
  .nav-link {
    font-size: 13px; font-weight: 500; color: var(--text-2);
    background: none; border: none; cursor: pointer;
    padding: 7px 12px; border-radius: 999px; text-decoration: none;
    transition: all .15s ease; white-space: nowrap;
  }
  .nav-link:hover { color: var(--text); background: var(--surface-2); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .status-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 500; color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .status-dot.online { background: var(--green); }
  .status-dot.offline { background: var(--red); }
  .btn-ghost {
    font-size: 13px; font-weight: 550; color: var(--text);
    background: transparent; border: 1px solid var(--border-2);
    border-radius: 8px; padding: 7px 15px; cursor: pointer; transition: all .15s ease;
    text-decoration: none;
  }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-solid {
    font-size: 13px; font-weight: 600; color: #000;
    background: var(--white); border: 1px solid var(--white);
    border-radius: 8px; padding: 7px 15px; cursor: pointer; transition: all .15s ease;
    text-decoration: none; white-space: nowrap;
  }
  .btn-solid:hover { background: #d9d9d9; border-color: #d9d9d9; }

  /* ================= Stage ================= */
  .stage { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

  /* thread (hidden on home) */
  .thread { flex: 1; overflow-y: auto; min-height: 0; display: none; }
  body.chatting .thread { display: block; }
  .thread-inner { max-width: 740px; margin: 0 auto; padding: 30px 28px 16px; }

  /* hero (hidden while chatting) */
  .hero {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0 24px 8vh;
  }
  body.chatting .hero { display: none; }
  .hero h1 {
    font-size: clamp(30px, 4.6vw, 46px); font-weight: 700;
    letter-spacing: -0.035em; color: var(--white); text-align: center;
    animation: fadeUp .5s ease both;
  }
  .hero-sub {
    font-size: 14px; color: var(--text-3); margin-top: 12px; text-align: center;
    animation: fadeUp .5s .05s ease both;
  }

  /* ================= Composer card (v0-style) ================= */
  .composer-wrap { width: 100%; display: flex; justify-content: center; padding: 26px 24px 0; }
  body.chatting .composer-wrap { padding: 10px 24px 20px; }
  .composer {
    width: 100%; max-width: 690px;
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    transition: border-color .18s ease, box-shadow .18s ease;
    animation: fadeUp .5s .1s ease both;
  }
  .composer:focus-within { border-color: rgba(255,255,255,.30); }
  .composer.dragover { border-color: var(--white); }

  .chips-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 4px; }
  .chips-row:empty { display: none; }
  .doc-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 550; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; cursor: pointer;
    transition: all .15s ease; max-width: 210px;
  }
  .doc-chip:hover { border-color: var(--border-2); color: var(--text); }
  .doc-chip.selected { border-color: rgba(255,255,255,.45); color: var(--white); background: var(--surface-3); }
  .doc-chip .cat-dot { width: 7px; height: 7px; border-radius: 50%; }
  .cat-Resume          { background: var(--blue); }
  .cat-Invoice         { background: var(--green); }
  .cat-ResearchPaper   { background: #bf7af0; }
  .cat-Report          { background: var(--amber); }
  .cat-GeneralDocument { background: var(--text-3); }
  .doc-chip .chip-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-chip .spin {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1.5px solid var(--text-3); border-top-color: var(--white);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #questionInput {
    width: 100%; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 15px; color: var(--text);
    padding: 10px 4px 14px; resize: none;
  }
  #questionInput::placeholder { color: var(--text-3); }

  .composer-bottom { display: flex; align-items: center; gap: 8px; }
  .scope-btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 550; color: var(--text-2);
    background: transparent; border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: all .15s ease;
    position: relative;
  }
  .scope-btn:hover { border-color: var(--border-2); color: var(--text); }
  .scope-btn svg { width: 12px; height: 12px; }
  .upload-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 550; color: var(--text-2);
    background: transparent; border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: all .15s ease;
  }
  .upload-btn:hover { border-color: var(--border-2); color: var(--text); }
  .upload-btn svg { width: 12px; height: 12px; }
  .pipe-status { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
  .pipe-status.active { display: inline-flex; }
  .pipe-status .spin {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid var(--text-3); border-top-color: var(--white);
    animation: spin .8s linear infinite;
  }
  #sendBtn {
    margin-left: auto; width: 34px; height: 34px; border-radius: 9px; border: none;
    background: var(--white); color: #000; display: grid; place-items: center;
    cursor: pointer; transition: all .15s ease;
  }
  #sendBtn svg { width: 15px; height: 15px; }
  #sendBtn:hover:not(:disabled) { background: #d9d9d9; }
  #sendBtn:disabled { background: var(--surface-3); color: var(--text-3); cursor: not-allowed; }
  #fileInput { display: none; }

  /* scope dropdown */
  .scope-menu {
    position: absolute; bottom: calc(100% + 8px); left: 0; min-width: 230px;
    max-width: calc(100vw - 44px);
    background: var(--surface-2); border: 1px solid var(--border-2);
    border-radius: 10px; padding: 5px; z-index: 30; display: none;
    box-shadow: 0 16px 48px rgba(0,0,0,.6);
  }
  .scope-menu.open { display: block; }
  .scope-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font-size: 12.5px; font-weight: 500; color: var(--text-2); text-align: left;
    background: none; border: none; border-radius: 7px; padding: 8px 10px; cursor: pointer;
  }
  .scope-item:hover { background: var(--surface-3); color: var(--text); }
  .scope-item.active { color: var(--white); }
  .scope-item .check { margin-left: auto; width: 12px; height: 12px; }

  /* suggestions (v0 pill row) */
  .suggs {
    display: flex; flex-wrap: wrap; gap: 9px; justify-content: center;
    margin-top: 22px; animation: fadeUp .5s .18s ease both;
  }
  .sugg {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 550; color: var(--text-2);
    background: transparent; border: 1px solid var(--border-2);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; transition: all .15s ease;
  }
  .sugg:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
  .sugg:disabled { opacity: .4; cursor: not-allowed; }
  .sugg svg { width: 13px; height: 13px; }

  /* ================= Turns (Perplexity-style) ================= */
  .turn { padding: 24px 0; animation: fadeUp .35s ease both; }
  .turn + .turn { border-top: 1px solid var(--border); }
  .turn-q { font-size: 19px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.35; color: var(--white); overflow-wrap: break-word; }
  .turn-body { margin-top: 15px; }

  .src-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .src-card {
    display: flex; flex-direction: column; gap: 3px;
    min-width: 128px; max-width: 185px; padding: 9px 11px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; transition: border-color .15s ease;
  }
  .src-card:hover { border-color: var(--border-2); }
  .src-top { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-3); }
  .src-num {
    display: inline-grid; place-items: center; width: 14px; height: 14px;
    font-size: 9px; font-weight: 700; color: var(--text);
    background: var(--surface-3); border-radius: 4px;
  }
  .src-name { font-size: 11px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ans-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 9px; font-size: 12px; font-weight: 650; color: var(--text-2); }
  .route-chip { font-size: 10.5px; font-weight: 550; color: var(--text-3); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; }
  .valid-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 650; color: var(--green);
    background: var(--green-dim); border-radius: 999px; padding: 2.5px 9px;
  }
  .valid-badge svg { width: 10.5px; height: 10.5px; }
  .withheld-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 650; color: var(--amber);
    background: var(--amber-dim); border-radius: 999px; padding: 2.5px 9px;
  }
  .ans-body { font-size: 14.5px; line-height: 1.75; overflow-wrap: break-word; }
  .ans-body p { margin: 6px 0; }
  .ans-body ul { margin: 8px 0 8px 20px; }
  .ans-body li { margin: 4px 0; }
  .ans-body b { font-weight: 650; color: var(--white); }
  .turn.notfound .ans-body { color: var(--text-2); }

  .working { display: flex; flex-direction: column; gap: 8px; padding: 2px 0; }
  .step { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-3); font-weight: 500; }
  .step .ring { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--text-3); display: grid; place-items: center; transition: all .3s ease; }
  .step.doing { color: var(--text); }
  .step.doing .ring { border-color: var(--white); border-top-color: transparent; animation: spin .8s linear infinite; }
  .step.done { color: var(--text-2); }
  .step.done .ring { border-color: var(--green); }
  .step.done .ring::after { content: "✓"; color: var(--green); font-size: 8px; font-weight: 700; }
  .dots { display: inline-flex; gap: 3px; margin-left: 4px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); animation: bounce 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-3px); opacity: 1; } }

  /* ================= Toasts ================= */
  .toasts { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast {
    background: var(--surface-2); border: 1px solid var(--border-2);
    border-radius: 9px; padding: 11px 15px; font-size: 12.5px; font-weight: 550;
    max-width: 330px; animation: slideIn .25s ease both;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    display: flex; align-items: center; gap: 9px;
  }
  .toast::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--white); flex-shrink: 0; }
  .toast.error::before { background: var(--red); }
  .toast.success::before { background: var(--green); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ================= Responsive ================= */
  @media (max-width: 900px) {
    .thread-inner { padding: 24px 20px 12px; }
    .composer-wrap { padding: 20px 18px 0; }
  }
  @media (max-width: 720px) {
    .nav { padding: 0 max(10px, env(safe-area-inset-left)) 0 max(10px, env(safe-area-inset-right)); gap: 6px; height: 52px; }
    .logo-name { display: none; }
    .nav-links { margin: 0 auto; gap: 0; }
    .nav-link { padding: 8px 8px; font-size: 12px; }
    .btn-solid { padding: 7px 11px; font-size: 12px; }
    .status-chip { padding: 5px 9px; font-size: 11px; }
    .hero { padding: 0 16px 12vh; }
    .hero h1 { font-size: clamp(24px, 7.5vw, 32px); }
    .hero-sub { font-size: 12.5px; padding: 0 8px; }
    .composer-wrap { padding: 18px 14px 0; }
    body.chatting .composer-wrap {
      padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    }
    .composer { padding: 10px 12px; border-radius: 14px; }
    /* 16px prevents iOS Safari from auto-zooming the page on focus */
    #questionInput { font-size: 16px; }
    .composer-bottom { flex-wrap: wrap; gap: 6px; }
    .scope-btn, .upload-btn { padding: 7px 11px; font-size: 11.5px; }
    .scope-menu { min-width: 200px; }
    #sendBtn { width: 38px; height: 38px; }
    .suggs { gap: 7px; margin-top: 18px; padding: 0 10px; }
    .sugg { font-size: 12px; padding: 8px 13px; }
    .thread-inner { padding: 18px 14px 8px; }
    .turn { padding: 20px 0; }
    .turn-q { font-size: 16.5px; }
    .ans-body { font-size: 13.5px; line-height: 1.7; }
    .src-card { min-width: 108px; max-width: 150px; padding: 8px 9px; }
    .doc-chip { max-width: 160px; font-size: 11.5px; }
    .toasts { left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); }
    .toast { max-width: none; }
  }
  /* large phones (Pro Max class) get slightly roomier text */
  @media (min-width: 421px) and (max-width: 500px) {
    .hero h1 { font-size: 28px; }
  }
  @media (max-width: 420px) {
    .status-chip span:last-child { display: none; }
    .status-chip { padding: 5px 8px; }
    .hero h1 { font-size: 23px; }
    .src-strip { gap: 6px; }
  }
  /* very small phones (320-360px) */
  @media (max-width: 360px) {
    .nav { padding: 0 8px; gap: 4px; }
    .nav-link { padding: 8px 5px; font-size: 11px; }
    .nav-link[href="/docs"] { display: none; }
    .status-chip { display: none; }
    .btn-solid { padding: 6px 8px; font-size: 10.5px; }
    .hero h1 { font-size: 21px; }
    .hero-sub { font-size: 11.5px; }
    .sugg { font-size: 11px; padding: 7px 11px; }
    .sugg svg { display: none; }
    .scope-btn, .upload-btn { padding: 6px 9px; font-size: 11px; }
    .doc-chip { max-width: 130px; font-size: 11px; }
    .src-card { min-width: 96px; max-width: 132px; }
  }
  /* phone landscape: keep the composer reachable without scrolling */
  @media (max-height: 520px) and (max-width: 950px) {
    .hero { justify-content: flex-start; padding-top: 20px; padding-bottom: 12px; }
    .hero h1 { font-size: 22px; }
    .hero-sub { margin-top: 6px; font-size: 11.5px; }
    .composer-wrap { padding-top: 12px; }
    .suggs { margin-top: 12px; }
    .turn { padding: 14px 0; }
  }
</style>
</head>
<body>

<!-- ================= Navbar ================= -->
<nav class="nav">
  <div class="logo">
    <div class="logo-mark"><i data-lucide="file-search"></i></div>
    <span class="logo-name">OZOCO SidePilot</span>
  </div>
  <div class="nav-links">
    <button class="nav-link" id="newChatBtn" type="button">New Chat</button>
    <a class="nav-link" href="/docs" target="_blank" rel="noopener">API</a>
    <a class="nav-link" href="https://github.com/vaibhav410/mini-ozoco-sidepilot" target="_blank" rel="noopener">GitHub</a>
  </div>
  <div class="nav-right">
    <span class="status-chip"><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting…</span></span>
    <button class="btn-solid" id="uploadNavBtn" type="button">Upload Document</button>
  </div>
</nav>

<!-- ================= Stage ================= -->
<div class="stage">

  <div class="thread" id="thread">
    <div class="thread-inner" id="threadInner"></div>
  </div>

  <div class="hero" id="hero">
    <h1>What do you want to know?</h1>
    <div class="hero-sub">Upload a document. Ask anything. Three agents make sure every answer is grounded in your sources.</div>
    <div class="composer-wrap" id="composerHome"></div>
    <div class="suggs" id="suggestions">
      <button class="sugg" data-q="Summarize this document in 3 bullet points." disabled>
        <i data-lucide="list"></i> Summarize
      </button>
      <button class="sugg" data-q="What are the key topics covered in this document?" disabled>
        <i data-lucide="tags"></i> Key topics
      </button>
      <button class="sugg" data-q="What details can you find about dates, amounts, or numbers?" disabled>
        <i data-lucide="hash"></i> Facts &amp; figures
      </button>
      <button class="sugg" data-q="Who won the 1998 FIFA World Cup?" disabled>
        <i data-lucide="scan-search"></i> Test grounding
      </button>
    </div>
  </div>

  <div class="composer-wrap" id="composerDock" style="display:none;"></div>

  <!-- The composer card itself (moved between home and dock) -->
  <div class="composer" id="composer" style="display:none;">
    <div class="chips-row" id="chipsRow"></div>
    <input id="questionInput" type="text" placeholder="Upload a document to start asking…" autocomplete="off" disabled>
    <div class="composer-bottom">
      <span style="position:relative;">
        <button class="scope-btn" id="scopeBtn" type="button">
          <i data-lucide="layers"></i><span id="scopeLabel">All documents</span><i data-lucide="chevron-down"></i>
        </button>
        <div class="scope-menu" id="scopeMenu"></div>
      </span>
      <button class="upload-btn" id="uploadBtn" type="button">
        <i data-lucide="paperclip"></i> Attach
      </button>
      <span class="pipe-status" id="pipeStatus"><span class="spin"></span><span id="pipeText">Uploading…</span></span>
      <button id="sendBtn" disabled aria-label="Send"><i data-lucide="arrow-up"></i></button>
    </div>
  </div>
  <input type="file" id="fileInput" accept=".pdf,.txt">

</div>

<div class="toasts" id="toasts"></div>

<script>
"use strict";

/* ---------------- state ---------------- */
const newSessionId = () =>
  (crypto.randomUUID ? crypto.randomUUID() : "s" + Date.now() + Math.random().toString(16).slice(2));
const state = { docs: [], selectedDocId: null, busy: false, sessionId: newSessionId() };

const $ = (id) => document.getElementById(id);
const threadEl = $("thread");
const threadInner = $("threadInner");
const composer = $("composer");

/* place composer in home position initially */
$("composerHome").appendChild(composer);
composer.style.display = "block";

/* ---------------- helpers ---------------- */
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderAnswer(text) {
  const lines = escapeHtml(text).split(/\r?\n/);
  let html = "", inList = false;
  for (const line of lines) {
    const m = line.match(/^\s*[-*•]\s+(.*)/);
    if (m) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${m[1]}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (line.trim()) html += `<p>${line}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

function toast(message, type = "info") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = message;
  $("toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .4s"; }, 3400);
  setTimeout(() => el.remove(), 3900);
}

function icons() { if (window.lucide) lucide.createIcons(); }
function scrollDown() { threadEl.scrollTop = threadEl.scrollHeight; }

function enterChatMode() {
  if (!document.body.classList.contains("chatting")) {
    document.body.classList.add("chatting");
    $("composerDock").style.display = "flex";
    $("composerDock").appendChild(composer);
  }
}
function enterHomeMode() {
  document.body.classList.remove("chatting");
  $("composerDock").style.display = "none";
  $("composerHome").appendChild(composer);
}

/* ---------------- health ---------------- */
async function checkHealth() {
  try {
    const res = await fetch("/health");
    const data = await res.json();
    $("statusDot").className = "status-dot online";
    $("statusText").textContent = `Online · ${data.documents_indexed} doc${data.documents_indexed === 1 ? "" : "s"}`;
  } catch {
    $("statusDot").className = "status-dot offline";
    $("statusText").textContent = "Offline";
  }
}

/* ---------------- upload ---------------- */
const PIPE_STAGES = ["Uploading file…", "Extracting text…", "Agent 1 · Classifying…", "Indexing to FAISS…"];
let pipeTimers = [];

function startPipe() {
  $("pipeStatus").classList.add("active");
  $("uploadBtn").style.display = "none";
  $("pipeText").textContent = PIPE_STAGES[0];
  pipeTimers = PIPE_STAGES.slice(1).map((label, i) =>
    setTimeout(() => { $("pipeText").textContent = label; }, (i + 1) * 1100));
}
function endPipe() {
  pipeTimers.forEach(clearTimeout);
  $("pipeStatus").classList.remove("active");
  $("uploadBtn").style.display = "";
}

async function uploadFile(file) {
  if (state.busy) return;
  if (!/\.(pdf|txt)$/i.test(file.name)) { toast("Only PDF and TXT files are supported.", "error"); return; }
  state.busy = true;
  startPipe();
  const temp = document.createElement("span");
  temp.className = "doc-chip";
  temp.innerHTML = `<span class="spin"></span><span class="chip-name">${escapeHtml(file.name)}</span>`;
  $("chipsRow").appendChild(temp);
  try {
    const form = new FormData();
    form.append("file", file);
    const res = await fetch("/upload", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Upload failed.");
    state.docs.push(data);
    // Auto-select the freshly uploaded document so "this document"
    // questions target it.
    state.selectedDocId = data.doc_id;
    renderChips();
    enableChat();
    toast(`Agent 1 · classified as ${data.category}`, "success");
    checkHealth();
  } catch (err) {
    toast(err.message, "error");
  } finally {
    temp.remove();
    endPipe();
    state.busy = false;
    renderChips();
  }
}

/* ---------------- document chips + scope ---------------- */
function renderChips() {
  const row = $("chipsRow");
  row.querySelectorAll(".doc-chip:not(.temp)").forEach((c) => c.remove());
  for (const doc of state.docs) {
    const chip = document.createElement("span");
    chip.className = "doc-chip" + (state.selectedDocId === doc.doc_id ? " selected" : "");
    chip.title = `${doc.category} · ${doc.summary}`;
    chip.innerHTML = `
      <span class="cat-dot cat-${doc.category.replace(/\s+/g, "")}"></span>
      <span class="chip-name">${escapeHtml(doc.filename)}</span>`;
    chip.addEventListener("click", () => {
      state.selectedDocId = state.selectedDocId === doc.doc_id ? null : doc.doc_id;
      renderChips();
    });
    row.appendChild(chip);
  }
  renderScope();
}

function renderScope() {
  const doc = state.docs.find((d) => d.doc_id === state.selectedDocId);
  $("scopeLabel").textContent = doc ? doc.filename : "All documents";
  $("questionInput").placeholder = state.docs.length
    ? (doc ? `Ask about ${doc.filename}…` : "Ask a question across your documents…")
    : "Upload a document to start asking…";
  const menu = $("scopeMenu");
  menu.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "scope-item" + (state.selectedDocId ? "" : " active");
  allBtn.innerHTML = `<i data-lucide="layers" style="width:12px;height:12px;"></i> All documents
    ${state.selectedDocId ? "" : '<i data-lucide="check" class="check"></i>'}`;
  allBtn.addEventListener("click", () => { state.selectedDocId = null; toggleMenu(false); renderChips(); });
  menu.appendChild(allBtn);
  for (const doc of state.docs) {
    const b = document.createElement("button");
    const active = state.selectedDocId === doc.doc_id;
    b.className = "scope-item" + (active ? " active" : "");
    b.innerHTML = `<span class="cat-dot cat-${doc.category.replace(/\s+/g, "")}" style="width:7px;height:7px;border-radius:50%;"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(doc.filename)}</span>
      ${active ? '<i data-lucide="check" class="check"></i>' : ""}`;
    b.addEventListener("click", () => { state.selectedDocId = doc.doc_id; toggleMenu(false); renderChips(); });
    menu.appendChild(b);
  }
  icons();
}

function toggleMenu(force) {
  const menu = $("scopeMenu");
  const open = force !== undefined ? force : !menu.classList.contains("open");
  menu.classList.toggle("open", open);
}

function enableChat() {
  $("questionInput").disabled = false;
  $("sendBtn").disabled = false;
  document.querySelectorAll(".sugg").forEach((b) => (b.disabled = false));
}

/* ---------------- conversation turns ---------------- */
function addTurn(question) {
  enterChatMode();
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = `
    <div class="turn-q">${escapeHtml(question)}</div>
    <div class="turn-body">
      <div class="working">
        <div class="step doing" data-w="0"><span class="ring"></span> Agent 2 · Routing to the relevant document</div>
        <div class="step" data-w="1"><span class="ring"></span> Retrieving context from FAISS</div>
        <div class="step" data-w="2"><span class="ring"></span> Agent 2 · Generating grounded answer</div>
        <div class="step" data-w="3"><span class="ring"></span> Agent 3 · Validating against sources <span class="dots"><i></i><i></i><i></i></span></div>
      </div>
    </div>`;
  threadInner.appendChild(el);
  icons(); scrollDown();
  const advance = (a, b) => () => {
    const s1 = el.querySelector(`[data-w="${a}"]`), s2 = el.querySelector(`[data-w="${b}"]`);
    if (s1) s1.className = "step done";
    if (s2) s2.className = "step doing";
  };
  const timers = [
    setTimeout(advance(0, 1), 900),
    setTimeout(advance(1, 2), 1900),
    setTimeout(advance(2, 3), 4300),
  ];
  return { el, timers };
}

function fillTurn(turn, data) {
  const notFound = !data.found;
  const v = data.validation || {};
  const seen = new Set();
  let num = 0;
  const cards = (data.sources || [])
    .filter((s) => {
      const key = `${s.filename}|${s.page ?? ""}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .map((s) => {
      num += 1;
      return `
      <div class="src-card" title="${escapeHtml(s.snippet)}">
        <div class="src-top"><span class="src-num">${num}</span> Source${s.page ? ` · page ${s.page}` : ""}</div>
        <div class="src-name">${escapeHtml(s.filename)}</div>
      </div>`;
    })
    .join("");
  const routeChip = data.routed_document
    ? `<span class="route-chip">→ ${escapeHtml(data.routed_document)}</span>` : "";
  const validBadge = v.checked && v.supported
    ? `<span class="valid-badge"><i data-lucide="shield-check"></i>Validated${v.confidence && v.confidence !== "unknown" ? " · " + escapeHtml(v.confidence) : ""}</span>`
    : (v.checked === true && v.supported === false
        ? `<span class="withheld-badge"><i data-lucide="shield-alert"></i>Withheld by Agent 3</span>` : "");
  const headText = notFound ? "Not found in documents" : "Answer";

  turn.el.classList.toggle("notfound", notFound);
  turn.el.querySelector(".turn-body").innerHTML = `
    ${cards ? `<div class="src-strip">${cards}</div>` : ""}
    <div class="ans-head">${headText} ${routeChip} ${validBadge}</div>
    <div class="ans-body">${renderAnswer(data.answer)}</div>`;
  icons(); scrollDown();
}

async function ask(question) {
  if (state.busy || !question.trim()) return;
  state.busy = true;
  $("sendBtn").disabled = true;
  const turn = addTurn(question);
  try {
    const body = { question, session_id: state.sessionId };
    if (state.selectedDocId) body.doc_id = state.selectedDocId;
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    turn.timers.forEach(clearTimeout);
    if (!res.ok) throw new Error(data.detail || "Something went wrong.");
    fillTurn(turn, data);
  } catch (err) {
    turn.timers.forEach(clearTimeout);
    turn.el.remove();
    toast(err.message, "error");
  } finally {
    state.busy = false;
    $("sendBtn").disabled = false;
    $("questionInput").focus();
  }
}

/* ---------------- events ---------------- */
$("uploadBtn").addEventListener("click", () => $("fileInput").click());
$("uploadNavBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
  e.target.value = "";
});
["dragover", "dragenter"].forEach((ev) =>
  composer.addEventListener(ev, (e) => { e.preventDefault(); composer.classList.add("dragover"); }));
["dragleave", "drop"].forEach((ev) =>
  composer.addEventListener(ev, (e) => { e.preventDefault(); composer.classList.remove("dragover"); }));
composer.addEventListener("drop", (e) => {
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
});

$("scopeBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleMenu(); });
document.addEventListener("click", (e) => {
  if (!e.target.closest(".scope-menu") && !e.target.closest(".scope-btn")) toggleMenu(false);
});

$("sendBtn").addEventListener("click", () => {
  const input = $("questionInput");
  const q = input.value.trim();
  if (q) { input.value = ""; ask(q); }
});
$("questionInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("sendBtn").click();
});
$("suggestions").addEventListener("click", (e) => {
  const chip = e.target.closest(".sugg");
  if (chip && !chip.disabled) ask(chip.dataset.q);
});
$("newChatBtn").addEventListener("click", () => {
  state.sessionId = newSessionId();
  threadInner.innerHTML = "";
  enterHomeMode();
  toast("New conversation started", "success");
});

/* ---------------- init ---------------- */
icons();
checkHealth();
setInterval(checkHealth, 30000);
</script>
</body>
</html>
