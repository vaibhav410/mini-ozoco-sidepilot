<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SidePilot Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#000; --surface:#0a0a0a; --surface-2:#141414;
    --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.16);
    --text:#ededed; --text-2:#a1a1a1; --text-3:#666;
    --green:#45d483; --green-dim:rgba(69,212,131,.1);
    --amber:#f5a623; --red:#ff5b56; --blue:#52a9ff; --purple:#bf7af0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Geist",sans-serif; background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; min-height:100vh; letter-spacing:-.01em;
  }
  .top { display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--border); }
  .badge-o { width:26px; height:26px; border-radius:8px; background:#fff; color:#000; display:grid; place-items:center; font-weight:800; font-size:13px; }
  .top h1 { font-size:15px; font-weight:700; }
  .top .sub { color:var(--text-3); font-size:12px; margin-left:4px; }
  .top a { margin-left:auto; color:var(--text-2); font-size:13px; text-decoration:none; padding:6px 12px; border:1px solid var(--border); border-radius:8px; }
  .top a:hover { color:var(--text); background:var(--surface-2); }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--green); }
  .live .dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .wrap { max-width:1100px; margin:0 auto; padding:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:22px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .card .label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:8px; }
  .card .big { font-size:26px; font-weight:700; letter-spacing:-.03em; }
  .card .sub { font-size:12px; color:var(--text-2); margin-top:4px; }
  .section { margin-bottom:22px; }
  .section h2 { font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; font-size:12.5px; padding:9px 14px; border-bottom:1px solid var(--border); }
  th { color:var(--text-3); font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase; background:var(--surface-2); }
  tr:last-child td { border-bottom:none; }
  td.mono { font-family:"Geist Mono",monospace; font-size:12px; }
  .pill { display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:99px; }
  .pill.g { color:var(--green); background:var(--green-dim); }
  .pill.a { color:var(--amber); background:rgba(245,166,35,.1); }
  .bar-row { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:12px; }
  .bar-name { width:150px; color:var(--text-2); }
  .bar { flex:1; height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--green); border-radius:5px; }
  .empty-note { color:var(--text-3); font-size:12.5px; padding:14px; text-align:center; }
</style>
</head>
<body>
<div class="top">
  <span class="badge-o">O</span>
  <h1>SidePilot Admin</h1><span class="sub">live system monitor</span>
  <span class="live" style="margin-left:14px"><span class="dot"></span><span id="refreshed">loading…</span></span>
  <a href="/">← Back to app</a>
</div>
<div class="wrap">
  <div class="grid" id="cards"></div>
  <div class="section"><h2>Pipeline timing (per stage)</h2><div id="stages" class="card"></div></div>
  <div class="section"><h2>Indexed documents</h2><div id="docs"></div></div>
  <div class="section"><h2>HTTP endpoints</h2><div id="http"></div></div>
  <div class="section"><h2>Intent distribution</h2><div id="intents" class="card"></div></div>
</div>
<script>
"use strict";
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmtUptime(sec) {
  if (sec < 90) return Math.round(sec) + "s";
  if (sec < 5400) return Math.round(sec/60) + "m";
  return (sec/3600).toFixed(1) + "h";
}
function card(label, big, sub) {
  return '<div class="card"><div class="label">'+label+'</div><div class="big">'+big+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}
/* If ADMIN_TOKEN is configured server-side, the dashboard was opened
   as /admin?token=... -- forward it to every /admin/* call so the
   page keeps working instead of showing 401s. */
const adminToken = new URLSearchParams(location.search).get("token") || "";
function adminFetch(path) {
  const url = adminToken ? path + "?token=" + encodeURIComponent(adminToken) : path;
  return fetch(url);
}

async function refresh() {
  try {
    const r = await adminFetch("/admin/stats");
    if (r.status === 401) {
      document.getElementById("refreshed").textContent = "unauthorized — open with ?token=<ADMIN_TOKEN>";
      return;
    }
    const s = await r.json();
    const m = s.metrics, mem = s.memory, sys = s.system;

    document.getElementById("cards").innerHTML =
      card("Status", '<span style="color:var(--green)">● Healthy</span>', "uptime " + fmtUptime(m.uptime_seconds)) +
      card("Documents", s.documents.length, s.exports + " generated files") +
      card("Sessions", mem.sessions != null ? mem.sessions : "—",
           mem.persistent ? '<span class="pill g">persistent</span>' : '<span class="pill a">in-memory</span>') +
      card("Messages", mem.messages != null ? mem.messages : "—",
           (mem.intents != null ? mem.intents : 0) + " intents · " + (mem.actions != null ? mem.actions : 0) + " actions") +
      card("Process memory", sys.process_memory_mb != null ? sys.process_memory_mb + " MB" : "—", "Python " + sys.python) +
      card("Models", esc(sys.model), (sys.fallback_model ? "fallback " + esc(sys.fallback_model) + " · " : "") + esc(sys.embeddings_backend) + " embeddings");

    /* Stage timings as bars scaled to the slowest stage */
    const stageKeys = Object.keys(m.timings).filter((k) => k.startsWith("stage.") || k === "workflow.total");
    if (stageKeys.length) {
      const max = Math.max.apply(null, stageKeys.map((k) => m.timings[k].avg_ms));
      document.getElementById("stages").innerHTML = stageKeys.sort().map((k) => {
        const t = m.timings[k];
        return '<div class="bar-row"><span class="bar-name">'+esc(k.replace("stage.",""))+'</span>' +
          '<span class="bar"><i style="width:'+Math.max(2,(t.avg_ms/max)*100)+'%"></i></span>' +
          '<span style="width:170px;color:var(--text-2)">avg '+t.avg_ms+'ms · p95 '+t.p95_ms+'ms · n='+t.total+'</span></div>';
      }).join("");
    } else {
      document.getElementById("stages").innerHTML = '<div class="empty-note">No pipeline runs yet — ask a question first.</div>';
    }

    document.getElementById("docs").innerHTML = s.documents.length
      ? '<table><tr><th>ID</th><th>File</th><th>Category</th><th>Chunks</th></tr>' +
        s.documents.map((d) => '<tr><td class="mono">'+esc(d.doc_id)+'</td><td>'+esc(d.filename)+'</td><td>'+esc(d.category)+'</td><td>'+d.chunks+'</td></tr>').join("") + '</table>'
      : '<div class="card empty-note">No documents indexed.</div>';

    const httpKeys = Object.keys(m.timings).filter((k) => k.startsWith("http."));
    document.getElementById("http").innerHTML = httpKeys.length
      ? '<table><tr><th>Endpoint</th><th>Calls</th><th>Avg</th><th>P95</th><th>Last</th></tr>' +
        httpKeys.sort().map((k) => { const t = m.timings[k];
          return '<tr><td class="mono">'+esc(k.slice(5))+'</td><td>'+t.total+'</td><td>'+t.avg_ms+'ms</td><td>'+t.p95_ms+'ms</td><td>'+t.last_ms+'ms</td></tr>'; }).join("") + '</table>'
      : '<div class="card empty-note">No requests recorded yet.</div>';

    const breakdown = (mem.intent_breakdown && Object.keys(mem.intent_breakdown).length)
      ? mem.intent_breakdown
      : Object.fromEntries(Object.entries(m.counters).filter(([k]) => k.startsWith("intent.")).map(([k,v]) => [k.slice(7), v]));
    const totalIntents = Object.values(breakdown).reduce((a,b) => a+b, 0);
    document.getElementById("intents").innerHTML = totalIntents
      ? Object.entries(breakdown).sort((a,b) => b[1]-a[1]).map(([name,n]) =>
          '<div class="bar-row"><span class="bar-name">'+esc(name)+'</span>' +
          '<span class="bar"><i style="width:'+Math.max(2,(n/totalIntents)*100)+'%"></i></span>' +
          '<span style="width:50px;color:var(--text-2)">'+n+'</span></div>').join("")
      : '<div class="empty-note">No intents detected yet.</div>';

    document.getElementById("refreshed").textContent = "refreshed " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("refreshed").textContent = "offline";
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
